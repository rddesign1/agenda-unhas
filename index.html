<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Agende seu horário de manicure em menos de um minuto, sem baixar app.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="/config.js"></script>
<title>Agenda do Salão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: página de salão em faixas (topo escuro vinho, corpo claro rosé, rodapé escuro); agendamento em 3 colunas no computador e empilhado no celular com barra fixa. */
:root{
  --brand:#A8506A; --on-brand:#fff;
  --bg:#FBF5F3; --surface:#FFFFFF; --fg:#2B1B22; --muted:#7A6670; --line:#EEDFE0;
  --soft:#F5E6E4;
  --noir:#241419; --noir-2:#311C23; --noir-fg:#F7ECE8; --noir-muted:#C9B3B5; --noir-line:#4A2E37;
  --gold:#C9A27E;
  --ok:#1F7A4D; --warn:#A15C00; --bad:#B42318;
  --display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body:"DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1013; --surface:#24171C; --fg:#F6ECEE; --muted:#BBA6AD; --line:#3E2A31; --soft:#2C1C22;
  --ok:#5FD39A; --warn:#F2B35A; --bad:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1013; --surface:#24171C; --fg:#F6ECEE; --muted:#BBA6AD; --line:#3E2A31; --soft:#2C1C22;
  --ok:#5FD39A; --warn:#F2B35A; --bad:#FF8A80; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 140px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:600}
h1{font-size:1.7rem;line-height:1.12}
h2{font-size:1.15rem;display:flex;align-items:center;gap:10px}
h3{font-size:1.1rem}
.n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--on-brand);font:700 .85rem var(--body);flex:none}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.stack{display:flex;flex-direction:column;gap:12px}
section{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.banner{background:color-mix(in srgb, var(--warn) 14%, var(--surface));border:1px solid color-mix(in srgb, var(--warn) 35%, transparent);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:.85rem}
.hero{display:flex;gap:14px;align-items:center}
.logo{width:68px;height:68px;border-radius:18px;flex:none;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font:700 1.6rem var(--display);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.875rem;color:var(--muted);margin-top:4px}
.svc{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;cursor:pointer}
.opt:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb, var(--brand) 55%, transparent);outline-offset:2px}
.opt[aria-pressed="true"]{border-color:var(--brand);background:color-mix(in srgb, var(--brand) 9%, var(--surface))}
.opt .grow{flex:1;min-width:0}
.opt strong{display:block}
.price{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.day{flex:none;width:62px;padding:10px 0;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;cursor:pointer;text-align:center;scroll-snap-align:start}
.day b{display:block;font:700 1.25rem var(--display);font-variant-numeric:tabular-nums}
.day span{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.day[aria-pressed="true"] span{color:var(--on-brand);opacity:.85}
.day:disabled{opacity:.38;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.slot{padding:11px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:500 1rem var(--body);font-variant-numeric:tabular-nums;cursor:pointer}
.slot[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.empty{padding:16px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted);font-size:.9rem}
label{display:flex;flex-direction:column;gap:6px;font-size:.875rem;font-weight:500}
input,select,textarea{font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:14px;border:0;background:var(--brand);color:var(--on-brand);font:700 1rem var(--body);cursor:pointer;text-decoration:none;text-align:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:.85rem;border-radius:10px;font-weight:500}
.btn.block{width:100%}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));z-index:5}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:12px;align-items:center}
.bar .sum{flex:1;min-width:0;font-size:.85rem;line-height:1.3}
.bar .sum b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.err{color:var(--bad);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.done-ic{width:56px;height:56px;border-radius:50%;background:color-mix(in srgb, var(--ok) 16%, var(--surface));color:var(--ok);display:grid;place-items:center;font-size:1.8rem}
.copy{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copy code{font:500 .95rem var(--body);background:var(--bg);border:1px solid var(--line);padding:6px 10px;border-radius:8px;user-select:all}
footer{margin-top:40px;text-align:center;font-size:.8rem;color:var(--muted)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer;padding:6px}
/* Painel */
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:14px}
.tabs button{flex:1;padding:10px;border:0;border-radius:10px;background:transparent;color:var(--fg);font:500 .95rem var(--body);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--brand);color:var(--on-brand)}
.daynav{display:flex;gap:8px;align-items:center}
.daynav input{flex:1}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{flex:1 1 90px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font:700 1.3rem var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bk{display:grid;grid-template-columns:58px 1fr;gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--st,var(--brand));border-radius:14px;padding:12px}
.bk .t{font:700 1.15rem var(--display);font-variant-numeric:tabular-nums}
.bk .info{min-width:0}
.bk .actions{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:99px;background:color-mix(in srgb, var(--st,var(--brand)) 16%, var(--surface));color:var(--st,var(--brand))}
.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.row > *{flex:1 1 120px;min-width:0}
.svcrow{display:grid;grid-template-columns:1fr 1fr 40px;gap:6px;align-items:center}
.svcrow > :first-child{grid-column:1 / -1}
.svcrow + .svcrow{padding-top:10px;border-top:1px solid var(--line)}
.svcrow input,.svcrow select{padding:10px 8px}
.x{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;font-size:1.1rem}
.hrow{display:grid;grid-template-columns:86px 1fr 1fr;gap:8px;align-items:center}
.hrow input[type=time]{padding:9px 8px}
.toggle{display:flex;flex-direction:row;align-items:center;gap:8px;font-weight:500}
.toggle input{width:20px;height:20px;padding:0}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--surface);outline:1.5px solid var(--line);cursor:pointer}
input[type=color]{width:52px;height:40px;padding:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom, 0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:9;max-width:calc(100% - 32px)}
.gallery{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.gallery button{flex:none;width:112px;height:112px;border-radius:14px;overflow:hidden;border:0;padding:0;cursor:pointer;background:var(--line)}
.gallery img,.pgrid img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.pgrid div{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;max-width:100%}
.pgrid .x{position:absolute;top:4px;right:4px;width:30px;height:30px;font-size:1rem;padding:0}
.lightbox{position:fixed;inset:0;z-index:20;background:rgba(10,6,8,.88);display:grid;place-items:center;padding:24px;cursor:zoom-out}
.lightbox img{max-height:85vh;border-radius:14px}
.policy{font-size:.85rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pix{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.pix .qr{background:#fff;padding:10px;border-radius:12px;line-height:0}
.pix textarea{font-size:.75rem;min-height:64px;word-break:break-all}
.amount{font:700 1.6rem var(--display);font-variant-numeric:tabular-nums}
.tip{font-size:.85rem;color:var(--muted)}
/* ====== Página da cliente ====== */
.site{padding-bottom:110px}
.inner{max-width:1120px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.band{padding-block:56px}
.eyebrow{font:600 .72rem var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.sec-title{display:block;font-size:clamp(1.6rem,4.5vw,2.3rem);line-height:1.1}
.sec-title em{font-style:italic;color:var(--brand)}
.rule{width:44px;height:2px;background:var(--gold);border:0;margin:14px 0 0}
.noir{background:var(--noir);color:var(--noir-fg)}
.noir .muted{color:var(--noir-muted)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;color:inherit;text-decoration:none}
.brand .logo{width:42px;height:42px;border-radius:50%;font-size:1rem}
.brand b{font:600 1.15rem var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.line{background:transparent;color:var(--noir-fg);border:1.5px solid var(--gold);font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem;padding:10px 16px}
.hero2{display:grid;gap:28px;padding-block:28px 64px;align-items:center}
.hero2 h1{font-size:clamp(2.4rem,9vw,4rem);line-height:1.02;font-weight:500}
.hero2 h1 em{display:block;font-style:italic;color:color-mix(in srgb, var(--brand) 55%, #F5C9C9)}
.hero2 p{max-width:34ch;color:var(--noir-muted);margin:14px 0 22px;font-size:1.05rem}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.hours{display:flex;gap:10px;align-items:center;font-size:.85rem;color:var(--noir-muted)}
.hours svg{color:var(--gold);flex:none}
.art{position:relative;min-height:320px;display:grid;place-items:center}
.arch{width:min(100%,360px);aspect-ratio:4/5;border-radius:999px 999px 24px 24px;overflow:hidden;border:1px solid var(--noir-line);max-width:100%}
.arch img{width:100%;height:100%;object-fit:cover;display:block}
.swatch{position:relative;width:min(100%,360px);aspect-ratio:4/5;border-radius:999px 999px 24px 24px;background:radial-gradient(120% 80% at 50% 0%, var(--noir-2), var(--noir));border:1px solid var(--noir-line);overflow:hidden;max-width:100%}
.swatch .fan{position:absolute;left:50%;bottom:30%;width:0;height:0}
.nail{position:absolute;left:-23px;bottom:0;width:46px;height:96px;transform-origin:50% 230%;border-radius:50% 50% 16px 16px / 62% 62% 16px 16px;box-shadow:0 8px 18px rgba(0,0,0,.35)}
.nail::after{content:"";position:absolute;left:22%;top:12%;width:16%;height:42%;border-radius:99px;background:rgba(255,255,255,.35)}
.swatch figcaption{position:absolute;left:0;right:0;top:38px;text-align:center;font:italic 500 1.05rem var(--display);color:var(--noir-fg)}
.swatch figcaption small{display:block;font:600 .66rem var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.next{position:absolute;left:0;bottom:12px;background:var(--surface);color:var(--fg);border-radius:16px;padding:12px 14px;box-shadow:0 14px 30px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;max-width:250px}
.next .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 4px color-mix(in srgb, var(--ok) 20%, transparent)}
.next b{display:block;font-size:.95rem}
.next span{font-size:.75rem;color:var(--muted)}
.perks{display:grid;gap:12px;margin-top:-34px;position:relative}
.perk{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.perk .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--brand);flex:none}
.perk b{display:block;font:600 1.02rem var(--display)}
.perk span{font-size:.88rem;color:var(--muted)}
.about{display:grid;gap:24px;align-items:center}
.about .pic{width:132px;height:132px;border-radius:50%;overflow:hidden;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font:500 2.6rem var(--display);border:6px solid var(--surface);box-shadow:0 0 0 1px var(--line);flex:none}
.about .pic img{width:100%;height:100%;object-fit:cover}
.about p{margin:12px 0 0;max-width:60ch;font-size:1.02rem}
.sign{font:italic 500 1.4rem var(--display);color:var(--brand);margin-top:10px}
.bookcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px 18px;margin-top:22px}
.steps{display:flex;gap:6px;margin:4px 0 22px;overflow-x:auto}
.step{display:flex;align-items:center;gap:8px;flex:1 1 0;min-width:0;font-size:.82rem;color:var(--muted)}
.step i{font-style:normal;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;flex:none;font-size:.8rem}
.step.on{color:var(--fg)} .step.on i{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.step.done i{background:var(--soft);border-color:var(--soft);color:var(--brand)}
.step span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:599px){.step:not(.on) span{display:none}.step{flex:0 0 auto}.step.on{flex:1 1 auto}}
.step + .step::before{content:"";flex:0 1 18px;height:1px;background:var(--line);margin-right:2px}
.bgrid{display:grid;gap:26px}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.col h3{display:flex;align-items:center;gap:8px;font-size:1.05rem}
.col h3 svg{color:var(--brand)}
.summary{background:var(--soft);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.summary dl{margin:0;display:grid;gap:10px}
.summary dt{font-size:.75rem;color:var(--muted)}
.summary dd{margin:2px 0 0;font-weight:500}
.summary .tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px}
.summary .tot b{font:600 1.4rem var(--display);color:var(--brand);font-variant-numeric:tabular-nums}
.desk{display:none}
@media (max-width:899px){.mobhide{display:none}}
.hint{font-size:.88rem;color:var(--muted);padding:14px;border:1.5px dashed var(--line);border-radius:14px}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:22px}
.gal button{aspect-ratio:1;border:0;padding:0;border-radius:16px;overflow:hidden;cursor:zoom-in;background:var(--line);max-width:100%}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.quotes{display:grid;gap:14px;margin-top:22px}
.quote{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px}
.stars{color:var(--gold);letter-spacing:2px}
.quote p{margin:0;font:italic 500 1.08rem/1.45 var(--display)}
.quote .who{display:flex;align-items:center;gap:10px;font-size:.88rem;font-weight:600}
.quote .av{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:.8rem}
.faq{margin-top:22px;display:flex;flex-direction:column;gap:10px;max-width:760px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
.faq summary{cursor:pointer;padding:12px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";color:var(--brand);font-size:1.3rem;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq p{margin:0 0 14px;color:var(--muted)}
.cta-band{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.cta-band h2{font-size:clamp(1.7rem,5vw,2.5rem);display:block;font-weight:500}
.cta-band h2 em{font-style:italic;color:color-mix(in srgb, var(--brand) 55%, #F5C9C9)}
.foot{display:grid;gap:28px;padding-block:44px 28px;font-size:.9rem}
.foot h4{margin:0 0 10px;font:600 .72rem var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;color:var(--noir-muted)}
.foot .copy-line{border-top:1px solid var(--noir-line);padding-block:16px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--noir-muted)}
.foot .link,.copy-line .link{color:var(--noir-muted)}
.site .banner{margin:0}
@media (max-width:899px){.swatch,.arch{width:min(100%,290px);aspect-ratio:5/6}.art{min-height:0}}
@media (min-width:720px){
  .perks{grid-template-columns:repeat(3,1fr)}
  .about{grid-template-columns:auto 1fr}
  .gal{grid-template-columns:repeat(4,1fr)}
  .quotes{grid-template-columns:repeat(3,1fr)}
  .foot{grid-template-columns:1.3fr 1fr 1fr}
}
@media (min-width:900px){
  .hero2{grid-template-columns:1.1fr .9fr;padding-block:40px 90px}
  .band{padding-block:80px}
  .bookcard{padding:30px}
  .bgrid{grid-template-columns:1fr 1.15fr .95fr;align-items:start}
  .desk{display:flex}
  .mob{display:none!important}
  .site{padding-bottom:0}
  .site .bar{display:none}
}
/* ====== App ====== */
html{background:var(--soft)}

<script>

/* ====== Utilidades ====== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const toMin = h => { const [a, b] = String(h).split(':').map(Number); return a * 60 + b; };
const fromMin = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const dk = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseDK = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const WD = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const WDL = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
const fmtDate = s => { const d = parseDK(s); return WD[d.getDay()] + ', ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1); };
const brl = v => (v === '' || v == null || isNaN(Number(v))) ? '' : Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const dur = m => { m = Number(m); const h = Math.floor(m / 60), r = m % 60; return h ? (h + 'h' + (r ? pad(r) : '')) : (r + ' min'); };
const digits = s => String(s || '').replace(/\D/g, '');
const waNum = s => { const d = digits(s); return d.length <= 11 ? '55' + d : d; };
const waLink = (num, text) => 'https://wa.me/' + waNum(num) + '?text=' + encodeURIComponent(text);
const fmtPhone = s => { const d = digits(s); return d.length === 11 ? `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}` : d.length === 10 ? `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}` : d; };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }
function applyBrand(color) {
  const c = /^#[0-9a-f]{6}$/i.test(color) ? color : DEFAULT_CONFIG.cor;
  const r = parseInt(c.slice(1, 3), 16), g = parseInt(c.slice(3, 5), 16), b = parseInt(c.slice(5, 7), 16);
  const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  document.documentElement.style.setProperty('--brand', c);
  document.documentElement.style.setProperty('--on-brand', lum > 0.62 ? '#1d1418' : '#ffffff');
}
function crc16(s) { let c = 0xFFFF; for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; } return c.toString(16).toUpperCase().padStart(4, '0'); }
// Gera o "Pix copia e cola" (BR Code estático do Banco Central) com valor.
function pixPayload(c, valor, txid) {
  const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9 ]/g, '').toUpperCase().trim();
  let key = String(c.pixChave || '').trim();
  if (c.pixTipo === 'telefone') { let d = digits(key); if (d.length > 11 && d.startsWith('55')) d = d.slice(2); key = '+55' + d; }
  else if (c.pixTipo === 'cpf') key = digits(key);
  else if (c.pixTipo === 'email') key = key.toLowerCase();
  const f = (id, v) => id + pad(v.length) + v;
  let p = f('00', '01') + f('26', f('00', 'br.gov.bcb.pix') + f('01', key)) + f('52', '0000') + f('53', '986')
    + (valor > 0 ? f('54', valor.toFixed(2)) : '') + f('58', 'BR')
    + f('59', norm(c.pixNome).slice(0, 25) || 'RECEBEDOR') + f('60', norm(c.pixCidade).slice(0, 15) || 'BRASIL')
    + f('62', f('05', String(txid || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 25) || '***')) + '6304';
  return p + crc16(p);
}
const sinalDe = (c, preco) => { if (!c.cobrarSinal || !c.pixChave) return 0; const p = Number(preco) || 0; const v = Number(c.sinalValor) || 0; return Math.round((c.sinalTipo === 'fixo' ? Math.min(v, p) : p * v / 100) * 100) / 100; };
async function copyText(text, el) { try { await navigator.clipboard.writeText(text); toast('Copiado'); } catch (e) { if (el) { el.focus(); el.select(); } toast('Selecione e copie o código'); } }
function lightbox(src) { const d = document.createElement('div'); d.className = 'lightbox'; d.setAttribute('role', 'dialog'); const i = document.createElement('img'); i.src = src; i.alt = 'Foto do trabalho'; d.appendChild(i); d.onclick = () => d.remove(); document.body.appendChild(d); }
const PINKEY = 'agenda-pin';
const memo = { get() { try { return localStorage.getItem(PINKEY); } catch (e) { return null; } }, set(v) { try { v ? localStorage.setItem(PINKEY, v) : localStorage.removeItem(PINKEY); } catch (e) {} } };
const initials = n => String(n || '?').split(/\s+/).filter(w => /^\p{L}/u.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join('');

/* ====== Conexão com o backend ======
   - Publicado no Google Apps Script: usa a planilha (dados reais, compartilhados).
   - Em qualquer outro lugar: modo demonstração, salva só neste aparelho. */
const IN_GAS = typeof google !== 'undefined' && google.script && google.script.run;
// Hospedado fora do Google (ex.: Vercel): config.js define window.APP_API_URL com a URL /exec do Apps Script.
const API_URL = (typeof window !== 'undefined' && window.APP_API_URL) || '';
const USE_API = !IN_GAS && /^https:\/\/script\.google\.com\//.test(API_URL);
const IS_LIVE = IN_GAS || USE_API;
async function callApi(fn, args) {
  let r;
  try { r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }) }); }
  catch (e) { throw new Error('Sem conexão com a agenda. Confira a internet e tente de novo.'); }
  const j = await r.json().catch(() => null);
  if (!j) throw new Error('A agenda não respondeu. Tente de novo em instantes.');
  if (!j.ok) throw new Error(j.error || 'Algo deu errado.');
  return j.data;
}
function call(fn, ...args) {
  if (USE_API) return callApi(fn, args);
  if (IN_GAS) return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(new Error((e && e.message) || String(e))))[fn](...args));
  return new Promise((res, rej) => setTimeout(() => { try { res(Demo[fn](...args)); } catch (e) { rej(e); } }, 150));
}

const Demo = (() => {
  const KEY = 'agenda-demo-v1'; let mem = null;
  const load = () => { if (mem) return mem; try { mem = JSON.parse(localStorage.getItem(KEY)); } catch (e) {} if (!mem) mem = seed(); return mem; };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} };
  function seed() {
    // Agendamentos de exemplo para o painel não abrir vazio.
    const out = []; const base = new Date();
    for (let i = 0, made = 0; i < 10 && made < 4; i++) {
      const d = new Date(base); d.setDate(d.getDate() + i);
      if (!DEFAULT_CONFIG.horarios[d.getDay()].aberto) continue;
      const ex = [['10:00', 's1', 'Ana (exemplo)'], ['14:00', 's4', 'Bruna (exemplo)'], ['16:30', 's3', 'Carla (exemplo)']][made % 3];
      const s = DEFAULT_CONFIG.servicos.find(x => x.id === ex[1]);
      out.push({ id: 'ex' + made, criado_em: '', data: dk(d), hora: ex[0], duracao: s.duracao, servico: s.nome, preco: s.preco, cliente: ex[2], telefone: '11988887777', status: 'agendado', obs: '' });
      made++;
    }

/* ====== Cálculo de horários livres ====== */
function slotsFor(dateKey, d) {
  const day = parseDK(dateKey); const h = cfg.horarios[day.getDay()];
  if (!h || !h.aberto) return [];
  const blocks = busy.filter(b => b.data === dateKey).map(b => [toMin(b.hora), toMin(b.hora) + Number(b.duracao)]);
  if (cfg.almoco && cfg.almoco[0] && cfg.almoco[1]) blocks.push([toMin(cfg.almoco[0]), toMin(cfg.almoco[1])]);
  const limit = Date.now() + (Number(cfg.antecedenciaHoras) || 0) * 3600e3;
  const out = []; const step = Number(cfg.passo) || 30;
  for (let t = toMin(h.ini); t + d <= toMin(h.fim); t += step) {
    const when = new Date(day); when.setHours(Math.floor(t / 60), t % 60, 0, 0);
    if (when.getTime() < limit) continue;
    if (blocks.some(([a, b]) => t < b && t + d > a)) continue;
    out.push(fromMin(t));
  }
  return out;
}
function nextDays() {
  const out = []; const base = new Date(); base.setHours(0, 0, 0, 0);
  const n = Math.min(Math.max(Number(cfg.diasAFrente) || 21, 1), 60);
  for (let i = 0; i < n; i++) { const d = new Date(base); d.setDate(d.getDate() + i); out.push(d); }
  return out;
}

function horarioResumo() {

}

async function doBook() {
  const svc = cfg.servicos.find(s => s.id === sel.svc); const err = $('#fErr');
  const btn = $('#app').querySelector('[data-confirm]'); btn.disabled = true; btn.textContent = 'Enviando…';
  const p = { data: sel.data, hora: sel.hora, duracao: Number(svc.duracao), servico: svc.nome, preco: svc.preco, cliente: me.nome, telefone: me.tel, obs: ($('#fObs').value || '').trim() };
  try {
    const r = await call('book', p);
    p.id = r && r.id; p.sinal = cfg.cobrarSinal ? 'pendente' : '';
    renderClient.obs = ''; sel = { svc: null, data: null, hora: null }; step = 1;
    lastDone = { b: p, fresh: true }; view = 'done';
    await loadPublic(); await loadMine(); renderClient();
  } catch (e) {
    await loadPublic(); step = 2; sel.hora = null; renderClient(); toast(e.message);
  }
}

/* ====== Confirmação / pagamento do sinal ====== */
function vDone() {
  const p = lastDone.b; const sinal = p.sinal === 'pendente' ? sinalDe(cfg, p.preco) : 0;
  const code = sinal ? pixPayload(cfg, sinal, p.id) : '';
  const msg = `Olá! ${lastDone.fresh ? 'Acabei de agendar' : 'Tenho horário de'} ${p.servico} para ${fmtDate(p.data)} às ${p.hora}. Meu nome é ${p.cliente || me.nome}.` + (sinal ? ` Segue o comprovante do sinal de ${brl(sinal)}.` : '');
  shell({
    title: lastDone.fresh ? (sinal ? 'Falta só o sinal' : 'Horário reservado') : 'Pagar sinal',
    back: () => { view = 'mine'; go('mine'); },
    body: `
      ${lastDone.fresh ? `<div class="done-ic" aria-hidden="true">✓</div>` : ''}
      <div class="card stack" style="gap:6px">
        <div><b>${esc(p.servico)}</b> · ${esc(brl(p.preco))}</div>
        <div>${esc(fmtDate(p.data))} às <b>${esc(p.hora)}</b> (${esc(dur(p.duracao))})</div>
        <div class="muted small">${esc(cfg.nome)}${cfg.endereco ? ' · ' + esc(cfg.endereco) : ''}</div>
      </div>
      ${sinal ? `
      <div class="card pix">
        <div class="muted small">Pague o sinal por Pix para garantir seu horário</div>
        <div class="amount">${esc(brl(sinal))}</div>
        <div class="qr" id="qr" aria-label="QR Code Pix"></div>
        <label style="width:100%;text-align:left">Pix copia e cola<textarea id="pixCode" readonly>${esc(code)}</textarea></label>
        <button class="btn block" id="copyPix">Copiar código Pix</button>
        <div class="muted small">Recebedor: ${esc(cfg.pixNome)} · O restante (${esc(brl((Number(p.preco) || 0) - sinal))}) você paga no dia.</div>
      </div>` : ''}
      ${cfg.whatsapp ? `
      <a class="btn ${sinal ? 'ghost ' : ''}block" target="_blank" rel="noopener" href="${esc(waLink(cfg.whatsapp, msg))}">${IC.wa}${sinal ? 'Enviar comprovante no WhatsApp' : 'Avisar no WhatsApp'}</a>
      <div class="copy small muted">WhatsApp do salão: <code>${esc(fmtPhone(cfg.whatsapp))}</code></div>` : ''}
      <button class="btn ghost block" id="toMine">Ver meus horários</button>`
  });
  if (sinal) {
    $('#copyPix').onclick = () => copyText(code, $('#pixCode'));
    try { if (window.QRCode) new QRCode($('#qr'), { text: code, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M }); else $('#qr').hidden = true; } catch (e) { $('#qr').hidden = true; }
  }
  $('#toMine').onclick = () => go('mine');
}

/* ====== Meus horários ====== */
function vMine() {
  const t = dk(new Date()); const up = upcoming();
  const past = mine.filter(b => !(b.data >= t && b.status === 'agendado')).sort((a, b) => (b.data + b.hora).localeCompare(a.data + a.hora)).slice(0, 15);
  const card = b => { const st = ST[b.status] || ST.agendado; const fut = b.data >= t && b.status === 'agendado';
    const msg = `Olá! Preciso remarcar/cancelar meu horário de ${b.servico} em ${fmtDate(b.data)} às ${b.hora}. Meu nome é ${me.nome}.`;
    return `<div class="bk" style="--st:${st.c}">
      <div class="t">${esc(b.hora)}</div>
      <div class="info"><div><b>${esc(fmtDate(b.data))}</b> <span class="chip">${st.label}</span>${fut && b.sinal === 'pendente' ? ' <span class="chip" style="--st:var(--warn)">Sinal pendente</span>' : fut && b.sinal === 'pago' ? ' <span class="chip" style="--st:var(--ok)">Sinal pago</span>' : ''}</div>
        <div class="small">${esc(b.servico)} · ${esc(brl(b.preco))}</div></div>
      ${fut ? `<div class="actions">${b.sinal === 'pendente' ? `<button class="btn sm" data-pay="${esc(b.id)}">Pagar sinal</button>` : ''}${cfg.whatsapp ? `<a class="btn ghost sm" target="_blank" rel="noopener" href="${esc(waLink(cfg.whatsapp, msg))}">Remarcar ou cancelar</a>` : ''}</div>`
        : b.status === 'concluido' ? `<div class="actions"><button class="btn ghost sm" data-again="${esc(b.servico)}">${IC.undo}Agendar de novo</button></div>` : ''}
    </div>`; };
  shell({
    title: 'Meus horários',
    body: `
      <h3 class="lbl">Próximos</h3>
      ${up.length ? up.map(card).join('') : `<div class="empty">Você não tem horário marcado. <button class="link" data-nav2="book" style="padding:0">Agendar agora</button></div>`}
      ${past.length ? `<h3 class="lbl">Anteriores</h3>${past.map(card).join('')}` : ''}`
  });
  bindCommon();
  $('#app').querySelectorAll('[data-again]').forEach(b => b.onclick = () => { const s = cfg.servicos.find(x => x.nome === b.dataset.again); if (s) pickService(s.id); else step = 1; view = 'book'; renderClient(); });
}

        ${hr.map(g => `<div class="kv"><span>${esc(g.dias)}</span><b>${esc(g.h)}</b></div>`).join('')}
        ${cfg.endereco ? `<div class="kv"><span>Endereço</span><b>${esc(cfg.endereco)}</b></div>` : ''}
        ${cfg.whatsapp ? `<div class="kv"><span>WhatsApp</span><b>${esc(fmtPhone(cfg.whatsapp))}</b></div>` : ''}
        ${cfg.instagram ? `<div class="kv"><span>Instagram</span><b>${esc(cfg.instagram)}</b></div>` : ''}
      </div>

  $('#app').querySelectorAll('[data-nav2]').forEach(b => b.onclick = () => go(b.dataset.nav2));

async function adminReload() {
  const r = await call('adminLogin', admin.pin);
  admin.bookings = r.bookings || []; admin.fotos = r.fotos || []; admin.url = r.url || '';
  cfg = Object.assign({}, DEFAULT_CONFIG, r.config || {}); applyBrand(cfg.cor);
}

  agendado: { label: 'Agendado', c: 'var(--brand)' },
  concluido: { label: 'Concluído', c: 'var(--ok)' },
  faltou: { label: 'Faltou', c: 'var(--warn)' },

};

function renderAgenda() {
  const list = admin.bookings.filter(b => b.data === admin.day).sort((a, b) => a.hora.localeCompare(b.hora));
  const ativos = list.filter(b => b.status === 'agendado' || b.status === 'concluido');
  const total = ativos.reduce((s, b) => s + (Number(b.preco) || 0), 0);
  const hoje = dk(new Date());
  const futuros = admin.bookings.filter(b => b.data >= hoje && b.status === 'agendado').length;
  const sinaisPend = admin.bookings.filter(b => b.data >= hoje && b.status === 'agendado' && b.sinal === 'pendente').length;
  $('#pane').innerHTML = `
    <div class="stack">
      <div class="daynav">
        <button class="x" id="prev" aria-label="Dia anterior">‹</button>
        <input type="date" id="dpick" value="${admin.day}">
        <button class="x" id="next" aria-label="Próximo dia">›</button>
        <button class="btn ghost sm" id="hoje">Hoje</button>
      </div>
      <div class="muted small">${esc(WDL[parseDK(admin.day).getDay()])}, ${esc(parseDK(admin.day).toLocaleDateString('pt-BR', { day: 'numeric', month: 'long' }))}</div>
      <div class="kpis">
        <div class="kpi"><b>${ativos.length}</b><span>atendimentos no dia</span></div>
        <div class="kpi"><b>${esc(brl(total) || 'R$ 0,00')}</b><span>previsto no dia</span></div>
        <div class="kpi"><b>${futuros}</b><span>agendados à frente</span></div>
        ${sinaisPend ? `<div class="kpi"><b>${sinaisPend}</b><span>sinais a conferir</span></div>` : ''}
      </div>
      ${list.length ? list.map(b => {
        const st = ST[b.status] || ST.agendado; const end = fromMin(toMin(b.hora) + Number(b.duracao));
        const lembrete = `Oi, ${b.cliente}! Passando para lembrar do seu horário de ${b.servico} ${fmtDate(b.data)} às ${b.hora} no ${cfg.nome}. Posso confirmar?`;
        return `<div class="bk" style="--st:${st.c}">
          <div class="t">${esc(b.hora)}</div>
          <div class="info">
            <div><b>${esc(b.cliente)}</b> <span class="chip">${st.label}</span>${b.sinal === 'pago' ? ' <span class="chip" style="--st:var(--ok)">Sinal pago</span>' : b.sinal === 'pendente' && b.status === 'agendado' ? ' <span class="chip" style="--st:var(--warn)">Sinal pendente</span>' : ''}</div>
            <div class="small">${esc(b.servico)}${b.preco !== '' ? ' · ' + esc(brl(b.preco)) : ''} · até ${end}</div>
            ${b.telefone ? `<div class="small muted">${esc(fmtPhone(b.telefone))}</div>` : ''}
            ${b.obs ? `<div class="small muted">“${esc(b.obs)}”</div>` : ''}
          </div>
          <div class="actions">
            ${b.status === 'bloqueado' ? `<button class="btn ghost sm" data-unblock="${esc(b.id)}">Desbloquear</button>` : `
              ${b.telefone ? `<a class="btn sm" target="_blank" rel="noopener" href="${esc(waLink(b.telefone, lembrete))}">Lembrete no WhatsApp</a>` : ''}
              ${b.sinal === 'pendente' && b.status === 'agendado' ? `<button class="btn ghost sm" data-sinal="pago" data-id="${esc(b.id)}">Sinal recebido</button>` : ''}
              ${b.status !== 'concluido' ? `<button class="btn ghost sm" data-st="concluido" data-id="${esc(b.id)}">Concluído</button>` : ''}
              ${b.status !== 'faltou' ? `<button class="btn ghost sm" data-st="faltou" data-id="${esc(b.id)}">Faltou</button>` : ''}
              ${b.status !== 'cancelado' ? `<button class="btn ghost sm" data-st="cancelado" data-id="${esc(b.id)}">Cancelar</button>` : `<button class="btn ghost sm" data-st="agendado" data-id="${esc(b.id)}">Reativar</button>`}`}
          </div>
        </div>`;
      }).join('') : `<div class="empty">Nenhum agendamento neste dia. Compartilhe o link do agendamento com suas clientes para começar a receber horários.</div>`}

      <details class="card">
        <summary style="cursor:pointer;font-weight:700">Bloquear um horário</summary>
        <p class="muted small">Para compromissos, folga ou cliente que marcou por fora. O horário some da agenda das clientes.</p>
        <div class="row">
          <label>Data<input type="date" id="bData" value="${admin.day}"></label>
          <label>Início<input type="time" id="bHora" value="12:00" step="900"></label>
          <label>Duração<select id="bDur">${[30, 60, 90, 120, 180, 240, 480].map(m => `<option value="${m}" ${m === 60 ? 'selected' : ''}>${dur(m)}</option>`).join('')}</select></label>
        </div>
        <label style="margin-top:8px">Motivo (opcional)<input id="bObs" maxlength="200" placeholder="Ex.: Joana, marcou pelo WhatsApp"></label>
        <button class="btn block" id="bGo" style="margin-top:10px">Bloquear</button>
      </details>
    </div>`;
  const go = d => { admin.day = d; renderAgenda(); };
  const shift = n => { const d = parseDK(admin.day); d.setDate(d.getDate() + n); go(dk(d)); };
  $('#prev').onclick = () => shift(-1); $('#next').onclick = () => shift(1); $('#hoje').onclick = () => go(dk(new Date()));
  $('#dpick').onchange = e => e.target.value && go(e.target.value);
  const act = async (fn, ...a) => { try { await call(fn, admin.pin, ...a); await adminReload(); renderAgenda(); toast('Agenda atualizada'); } catch (e) { toast(e.message); } };
  $('#pane').querySelectorAll('[data-st]').forEach(b => b.onclick = () => act('adminSetStatus', b.dataset.id, b.dataset.st));
  $('#pane').querySelectorAll('[data-sinal]').forEach(b => b.onclick = () => act('adminSetSinal', b.dataset.id, b.dataset.sinal));
  $('#pane').querySelectorAll('[data-unblock]').forEach(b => b.onclick = () => act('adminUnblock', b.dataset.unblock));
  $('#bGo').onclick = () => { const v = { data: $('#bData').value, hora: $('#bHora').value, duracao: Number($('#bDur').value), obs: $('#bObs').value }; if (!v.data || !v.hora) return toast('Informe data e horário.'); act('adminBlock', v); };
}

function renderRetorno() {
  const hoje = dk(new Date()); const porTel = {};
  admin.bookings.filter(b => b.telefone && b.status !== 'bloqueado').forEach(b => (porTel[b.telefone] = porTel[b.telefone] || []).push(b));
  const lista = [];
  Object.keys(porTel).forEach(t => {
    const bs = porTel[t];
    if (bs.some(b => b.data >= hoje && b.status === 'agendado')) return; // já tem horário marcado
    const feitos = bs.filter(b => b.status === 'concluido').sort((a, b) => b.data.localeCompare(a.data));
    if (!feitos.length) return;
    const ult = feitos[0]; lista.push({ ult, dias: Math.round((parseDK(hoje) - parseDK(ult.data)) / 864e5) });
  });
  lista.sort((a, b) => b.dias - a.dias);
  const meta = Number(cfg.diasRetorno) || 21;
  const hora = lista.filter(x => x.dias >= meta), depois = lista.filter(x => x.dias < meta);
  const item = ({ ult, dias }) => {
    const txt = `Oi, ${ult.cliente}! Já faz ${dias} dias da sua ${ult.servico.toLowerCase()} aqui no ${cfg.nome}. Bora deixar as unhas em dia?` + (admin.url ? ` Agende pelo link: ${admin.url}` : '');
    return `<div class="bk" style="--st:${dias >= meta ? 'var(--brand)' : 'var(--line)'}">
      <div class="t">${dias}d</div>
      <div class="info"><div><b>${esc(ult.cliente)}</b></div><div class="small muted">Último: ${esc(ult.servico)} em ${esc(fmtDate(ult.data))}</div></div>
      <div class="actions"><a class="btn sm" target="_blank" rel="noopener" href="${esc(waLink(ult.telefone, txt))}">Chamar no WhatsApp</a></div>
    </div>`;
  };
  $('#pane').innerHTML = `<div class="stack">
    <p class="tip" style="margin:0">Clientes atendidas que ainda não marcaram de novo. Quem passou de ${meta} dias aparece primeiro. Mude esse prazo em Meu salão.</p>
    <h3>Hora de voltar (${hora.length})</h3>
    ${hora.length ? hora.map(item).join('') : '<div class="empty">Ninguém passou do prazo ainda.</div>'}
    ${depois.length ? `<h3>Em breve (${depois.length})</h3>${depois.map(item).join('')}` : ''}
  </div>`;
}

          <span class="small" style="font-weight:500">Logo</span>
          <div style="display:flex;gap:12px;align-items:center">
            <div class="logo" style="width:56px;height:56px">${c.logo ? `<img alt="" src="${esc(c.logo)}">` : esc(initials(c.nome))}</div>
            <label class="btn ghost sm" style="flex-direction:row">Enviar imagem<input type="file" id="cLogo" accept="image/*" hidden></label>
            ${c.logo ? '<button type="button" class="btn ghost sm" id="cLogoX">Remover</button>' : ''}
          </div>
        </div>
      </div>

      <div class="card stack">
        <h3>Serviços</h3>
        <p class="muted small" style="margin:0">Nome, duração e preço (R$) de cada serviço.</p>
        ${c.servicos.map((s, i) => `<div class="svcrow">
          <input data-sv="${i}" data-k="nome" value="${esc(s.nome)}" maxlength="50" aria-label="Nome do serviço">
          <select data-sv="${i}" data-k="duracao" aria-label="Duração">${[...new Set([...DURS, Number(s.duracao)])].sort((a, b) => a - b).map(m => `<option value="${m}" ${m === Number(s.duracao) ? 'selected' : ''}>${dur(m)}</option>`).join('')}</select>
          <input data-sv="${i}" data-k="preco" inputmode="decimal" value="${esc(s.preco)}" aria-label="Preço">
          <button type="button" class="x" data-rm="${i}" aria-label="Remover serviço">×</button>
        </div>`).join('')}
        <button type="button" class="btn ghost sm" id="addSvc">+ Adicionar serviço</button>
      </div>

      <div class="card stack">
        <h3>Horário de atendimento</h3>
        ${[1, 2, 3, 4, 5, 6, 0].map(w => { const h = c.horarios[w]; return `<div class="hrow">
          <label class="toggle"><input type="checkbox" data-hw="${w}" data-k="aberto" ${h.aberto ? 'checked' : ''}>${WD[w]}</label>
          <input type="time" data-hw="${w}" data-k="ini" value="${esc(h.ini)}" ${h.aberto ? '' : 'disabled'} aria-label="Abre ${WDL[w]}">
          <input type="time" data-hw="${w}" data-k="fim" value="${esc(h.fim)}" ${h.aberto ? '' : 'disabled'} aria-label="Fecha ${WDL[w]}">
        </div>`; }).join('')}
        <div class="row">
          <label>Almoço das<input type="time" id="cAl1" value="${esc(c.almoco[0] || '')}"></label>
          <label>até<input type="time" id="cAl2" value="${esc(c.almoco[1] || '')}"></label>
        </div>
        <div class="row">
          <label>Intervalo da grade<select id="cPasso">${[15, 30, 60].map(m => `<option value="${m}" ${m === Number(c.passo) ? 'selected' : ''}>${m} min</option>`).join('')}</select></label>
          <label>Antecedência mínima<select id="cAnt">${[0, 1, 2, 3, 6, 12, 24].map(h => `<option value="${h}" ${h === Number(c.antecedenciaHoras) ? 'selected' : ''}>${h ? h + 'h' : 'nenhuma'}</option>`).join('')}</select></label>
          <label>Agenda aberta por<select id="cDias">${[7, 14, 21, 30, 45, 60].map(d => `<option value="${d}" ${d === Number(c.diasAFrente) ? 'selected' : ''}>${d} dias</option>`).join('')}</select></label>
        </div>
      </div>

      <div class="card stack">
        <h3>Sua página</h3>
        <label>Seu nome (como as clientes te chamam)<input id="cProf" maxlength="40" value="${esc(c.profissional || '')}"></label>
        <label>Sobre você<textarea id="cSobre" maxlength="600" style="min-height:110px">${esc(c.sobre || '')}</textarea></label>
        <span class="small" style="font-weight:500">Seus 3 diferenciais</span>
        ${[0, 1, 2].map(i => `<input data-dif="${i}" maxlength="60" value="${esc((c.diferenciais || [])[i] || '')}" aria-label="Diferencial ${i + 1}">`).join('')}
        <label>Formas de pagamento<input id="cPag" maxlength="80" value="${esc(c.pagamentos || '')}"></label>
        <span class="small" style="font-weight:500">Depoimentos de clientes (peça no WhatsApp e cole aqui)</span>
        ${[0, 1, 2].map(i => { const d = (c.depoimentos || [])[i] || {}; return `<div class="stack" style="gap:6px"><input data-dep="${i}" data-k="nome" maxlength="40" placeholder="Nome da cliente" value="${esc(d.nome || '')}" aria-label="Nome da cliente ${i + 1}"><textarea data-dep="${i}" data-k="texto" maxlength="220" placeholder="O que ela disse" aria-label="Depoimento ${i + 1}">${esc(d.texto || '')}</textarea></div>`; }).join('')}
        <p class="tip" style="margin:0">A primeira foto dos seus trabalhos vira a capa da página, e a segunda aparece ao lado do "Sobre você".</p>
      </div>

      <div class="card stack">
        <h3>Sinal por Pix</h3>
        <label class="toggle"><input type="checkbox" id="cSinal" ${c.cobrarSinal ? 'checked' : ''}>Cobrar sinal para confirmar o horário</label>
        <div class="row">
          <label>Tipo<select id="cSinTipo"><option value="percent" ${c.sinalTipo === 'percent' ? 'selected' : ''}>% do serviço</option><option value="fixo" ${c.sinalTipo === 'fixo' ? 'selected' : ''}>Valor fixo (R$)</option></select></label>
          <label>Valor<input id="cSinVal" inputmode="decimal" value="${esc(c.sinalValor)}"></label>
        </div>
        <div class="row">
          <label>Tipo da chave<select id="cPixTipo">${[['telefone', 'Celular'], ['cpf', 'CPF/CNPJ'], ['email', 'E-mail'], ['aleatoria', 'Aleatória']].map(([v, l]) => `<option value="${v}" ${c.pixTipo === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
          <label>Chave Pix<input id="cPix" maxlength="77" value="${esc(c.pixChave)}"></label>
        </div>
        <div class="row">
          <label>Nome de quem recebe<input id="cPixNome" maxlength="25" value="${esc(c.pixNome)}"></label>
          <label>Cidade<input id="cPixCid" maxlength="15" value="${esc(c.pixCidade)}"></label>
        </div>
        <p class="tip" style="margin:0">A cliente vê o QR Code e o "copia e cola" com o valor do sinal. Você confere o comprovante e marca "Sinal recebido" na agenda.</p>
        <label>Política de cancelamento<textarea id="cPol" maxlength="400">${esc(c.politica)}</textarea></label>
      </div>

      <div class="card stack">
        <h3>Fotos dos seus trabalhos</h3>
        <p class="tip" style="margin:0">Aparecem no topo da página de agendamento. Até 12 fotos. Salvam na hora.</p>
        <div class="pgrid">${admin.fotos.map(f => `<div><img alt="" src="${esc(f.img)}"><button type="button" class="x" data-rmfoto="${esc(f.id)}" aria-label="Remover foto">×</button></div>`).join('')}</div>
        ${admin.fotos.length < 12 ? '<label class="btn ghost sm" style="flex-direction:row">+ Adicionar fotos<input type="file" id="cFoto" accept="image/*" multiple hidden></label>' : ''}
      </div>

      <div class="card stack">
        <h3>Acesso</h3>
        <label>PIN da área da manicure<input id="cPin" inputmode="numeric" maxlength="12" value="${esc(c.pin)}"></label>
        <p class="muted small" style="margin:0">Troque o PIN 1234 antes de divulgar o link. Neste aparelho você continua conectada até tocar em Sair.</p>
        <label>Chamar de volta depois de<select id="cRet">${[7, 10, 14, 15, 21, 28, 30, 45].map(d => `<option value="${d}" ${d === Number(c.diasRetorno) ? 'selected' : ''}>${d} dias</option>`).join('')}</select></label>
        <p class="tip" style="margin:0">Dica: abra o link de agendamento no celular e use "Adicionar à tela de início". Fica um ícone igual a um app, sem baixar nada.</p>
      </div>
      <div class="err" id="cErr" hidden></div>
      <button class="btn block" id="cSave">Salvar alterações</button>
    </form>`;

  const sync = () => {
    c.nome = $('#cNome').value.trim(); c.descricao = $('#cDesc').value.trim(); c.endereco = $('#cEnd').value.trim();
    c.whatsapp = digits($('#cWa').value); c.instagram = $('#cIg').value.trim(); c.cor = $('#cCor').value;
    c.almoco = [$('#cAl1').value, $('#cAl2').value]; c.passo = Number($('#cPasso').value); c.antecedenciaHoras = Number($('#cAnt').value);
    c.diasAFrente = Number($('#cDias').value); c.pin = $('#cPin').value.trim();
    c.cobrarSinal = $('#cSinal').checked; c.sinalTipo = $('#cSinTipo').value; c.sinalValor = Number(String($('#cSinVal').value).replace(',', '.')) || 0;
    c.pixTipo = $('#cPixTipo').value; c.pixChave = $('#cPix').value.trim(); c.pixNome = $('#cPixNome').value.trim(); c.pixCidade = $('#cPixCid').value.trim();
    c.politica = $('#cPol').value.trim(); c.diasRetorno = Number($('#cRet').value);
    c.profissional = $('#cProf').value.trim(); c.sobre = $('#cSobre').value.trim(); c.pagamentos = $('#cPag').value.trim();
    c.diferenciais = [...$('#pane').querySelectorAll('[data-dif]')].map(el => el.value.trim());
    const deps = [{}, {}, {}]; $('#pane').querySelectorAll('[data-dep]').forEach(el => deps[el.dataset.dep][el.dataset.k] = el.value.trim());
    c.depoimentos = deps.filter(d => d.texto);
    $('#pane').querySelectorAll('[data-sv]').forEach(el => { const s = c.servicos[el.dataset.sv]; s[el.dataset.k] = el.dataset.k === 'nome' ? el.value : Number(String(el.value).replace(',', '.')) || 0; });
    $('#pane').querySelectorAll('[data-hw]').forEach(el => { const h = c.horarios[el.dataset.hw]; h[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value; });
  };
  $('#pane').querySelectorAll('[data-cor]').forEach(b => b.onclick = () => { sync(); c.cor = b.dataset.cor; applyBrand(c.cor); renderConfig(); });
  $('#cCor').oninput = e => applyBrand(e.target.value);
  $('#pane').querySelectorAll('[data-hw][type=checkbox]').forEach(el => el.onchange = () => { sync(); renderConfig(); });
  $('#pane').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { sync(); c.servicos.splice(Number(b.dataset.rm), 1); renderConfig(); });
  $('#addSvc').onclick = () => { sync(); c.servicos.push({ id: 's' + Date.now().toString(36), nome: 'Novo serviço', duracao: 60, preco: 0 }); renderConfig(); };
  if ($('#cLogoX')) $('#cLogoX').onclick = () => { sync(); c.logo = ''; renderConfig(); };
  $('#cLogo').onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => { const img = new Image(); img.onload = () => {
      const S = 192, cv = document.createElement('canvas'); cv.width = cv.height = S; const x = cv.getContext('2d');
      x.fillStyle = '#ffffff'; x.fillRect(0, 0, S, S);
      const r = Math.max(S / img.width, S / img.height), w = img.width * r, h = img.height * r;
      x.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
      sync(); c.logo = cv.toDataURL('image/jpeg', 0.85); renderConfig();
    }; img.src = rd.result; };
    rd.readAsDataURL(file);
  };
  $('#pane').querySelectorAll('[data-rmfoto]').forEach(b => b.onclick = async () => { sync(); try { const r = await call('adminRemovePhoto', admin.pin, b.dataset.rmfoto); admin.fotos = r.fotos; renderConfig(); toast('Foto removida'); } catch (e) { toast(e.message); } });
  if ($('#cFoto')) $('#cFoto').onchange = async e => {
    sync(); const files = [...e.target.files].slice(0, 12 - admin.fotos.length);
    for (const file of files) {
      try { const img = await shrink(file); const r = await call('adminAddPhoto', admin.pin, img); admin.fotos = r.fotos; }
      catch (er) { toast(er.message); break; }
    }
    renderConfig(); toast('Fotos salvas');
  };
  $('#cf').onsubmit = async e => {
    e.preventDefault(); sync(); const err = $('#cErr'); err.hidden = true;
    const bad = m => { err.textContent = m; err.hidden = false; };
    if (!c.nome) return bad('Informe o nome do salão.');
    if (!c.servicos.length) return bad('Cadastre pelo menos um serviço.');
    if (c.servicos.some(s => !String(s.nome).trim())) return bad('Algum serviço está sem nome.');
    if (!c.horarios.some(h => h.aberto)) return bad('Marque pelo menos um dia de atendimento.');
    if (c.horarios.some(h => h.aberto && toMin(h.fim) <= toMin(h.ini))) return bad('Confira os horários: o fechamento precisa ser depois da abertura.');
    if (String(c.pin).length < 4) return bad('Use um PIN com pelo menos 4 dígitos.');
    if (c.cobrarSinal && !c.pixChave) return bad('Informe a chave Pix ou desligue o sinal.');
    if (c.cobrarSinal && (!c.pixNome || !c.pixCidade)) return bad('Informe o nome de quem recebe e a cidade (o banco exige no Pix).');
    const btn = $('#cSave'); btn.disabled = true; btn.textContent = 'Salvando…';
    try {
      await call('adminSaveConfig', admin.pin, c);
      admin.pin = c.pin; memo.set(c.pin); admin.draft = null; cfg = Object.assign({}, DEFAULT_CONFIG, c); applyBrand(cfg.cor);
      toast('Salão atualizado'); renderAdmin();
    } catch (er) { bad(er.message); btn.disabled = false; btn.textContent = 'Salvar alterações'; }
  };
}

// Reduz a foto para caber numa célula da planilha (~45 mil caracteres).
function shrink(file) {
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onerror = () => rej(new Error('Não foi possível ler a imagem.'));
    rd.onload = () => { const img = new Image(); img.onerror = () => rej(new Error('Formato de imagem não suportado.')); img.onload = () => {
      for (const [S, q] of [[560, .72], [480, .62], [400, .55], [320, .5]]) {
        const r = Math.min(1, S / Math.max(img.width, img.height)); const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * r); cv.height = Math.round(img.height * r);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        const out = cv.toDataURL('image/jpeg', q); if (out.length < 45000) return res(out);
      }
      rej(new Error('Foto muito pesada. Tente outra.'));
    }; img.src = rd.result; };
    rd.readAsDataURL(file);
  });
}

/* ====== Início ====== */
(async () => { applyBrand(cfg.cor); await loadPublic(); me = sess.get(); if (me) await loadMine(); renderClient(); })();
</script>
